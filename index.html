<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ef" />
    <meta name="description" content="Реальные вопросы с технических интервью в сильнейших IT-компаниях." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>sobes-it — подготовка к IT-интервью</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev-диагностика: показываем JS-ошибки баннером, чтобы было видно без консоли
      ;(function () {
        function show(msg) {
          var d = document.createElement('pre')
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#5b1113;color:#ffd7d7;padding:10px 14px;font:11px/1.5 monospace;white-space:pre-wrap;margin:0;max-height:40vh;overflow:auto'
          d.textContent = 'JS error: ' + msg
          document.body.appendChild(d)
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          show('unhandled rejection: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)))
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
